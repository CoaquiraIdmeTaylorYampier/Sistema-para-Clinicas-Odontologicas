<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentalPlanner - Registro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bevan&family=Kanit&family=Poppins&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/registro.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- CDN(Red de Entrega de Contenidos) es como una libreria que ya tiene la cajita de mensajes ya incluida con todo, para el registro okey o error -->
</head>
<body>
    <button class="BotonRegresar" onclick="window.location.href='../index.html'">&#8592; Volver</button>
    <div class="ContenedorRegistro">
        
        <div class="PanelIzquierdo">
            <div class="ContenedorLogo">
                <img src="../assets/images/logo_muela.png" alt="Logo" class="MuelaLogo">
                <span class="TextoLogo">DentalPlanner</span>
            </div>
            <img src="../assets/images/imagen_logeo.png" alt="Ilustración" class="ImagenLogeo">
        </div>

        <div class="PanelDerecho">
            <div class="TarjetaFormulario">
                <h2 class="TituloFormulario">Crea tu Cuenta</h2>
                
                <form class="FormularioRegistro">
                    <div class="CampoFormulario">
                        <label class="EtiquetaFormulario">Nombre Completo</label>
                        <input type="text" placeholder="Ingresa tu nombre completo" class="EntradaFormulario">
                    </div>

                    <div class="CampoFormulario">
                        <label class="EtiquetaFormulario">Apellido Paterno/Materno</label>
                        <input type="text" placeholder="Ingresa tu apellido" class="EntradaFormulario">
                    </div>

                    <div class="CampoFormulario">
                        <label class="EtiquetaFormulario">Edad (años)</label>
                        <input type="number" placeholder="Ingresa tu edad" class="EntradaFormulario">
                    </div>

                    <div class="CampoFormulario">
                        <label class="EtiquetaFormulario">Número de Teléfono</label>
                        <input type="tel" placeholder="Ingresa tu teléfono" class="EntradaFormulario">
                    </div>

                    <div class="CampoFormulario">
                        <label class="EtiquetaFormulario">Correo Electrónico</label>
                        <input type="email" placeholder="Ingresa tu email" class="EntradaFormulario">
                    </div>

                    <div class="CampoFormulario">
                        <label class="EtiquetaFormulario">Contraseña</label>
                        <input type="password" placeholder="Ingresa tu contraseña" class="EntradaFormulario">
                    </div>

                    <div class="GrupoBotones">
                        <button type="submit" class="BotonAccion BotonRegistrar">Registrar Datos</button>
                        <button type="button" class="BotonAccion BotonIniciarSesion" onclick="window.location.href='login.html'">Iniciar Sesión (Ya tengo cuenta)</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
    <script src="../js/registro.js"></script>
</body>
</html>
