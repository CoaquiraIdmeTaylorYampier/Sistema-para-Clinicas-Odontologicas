<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Registrar Odontólogo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bevan&family=Kanit&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/registro.css"> <!-- Reutilizamos tu mismo CSS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <button class="BotonRegresar" onclick="window.location.href='../index.html'">&#8592; Volver</button>
    <button class="BotonRegresar" style="top: 70px;" onclick="window.location.href='admin-logs.html'">🛡️</button>
    <div class="ContenedorRegistro">
        
        <div class="PanelIzquierdo">
            <div class="ContenedorLogo">
                <img src="../assets/images/logo_muela.png" alt="Logo" class="MuelaLogo">
                <span class="TextoLogo">DentalPlanner</span>
            </div>
            <!-- Puedes cambiar esta imagen por una de doctores si la tienes -->
            <img src="../assets/images/imagen_logeo.png" alt="Ilustración" class="ImagenLogeo">
        </div>

        <div class="PanelDerecho">
            <div class="TarjetaFormulario">
                <h2 class="TituloFormulario">Registrar Odontólogo</h2>
                <p style="text-align: center; color: #666; margin-bottom: 20px; font-family: 'Poppins', sans-serif;">Acceso exclusivo para Administración</p>
                
                <form class="FormularioRegistro" id="formRegistroOdontologo">
                    <div class="CampoFormulario">
                        <label class="EtiquetaFormulario">Nombres</label>
                        <input type="text" id="nombres" placeholder="Nombres del doctor" class="EntradaFormulario" required>
                    </div>

                    <div class="CampoFormulario">
                        <label class="EtiquetaFormulario">Apellidos</label>
                        <input type="text" id="apellidos" placeholder="Apellidos del doctor" class="EntradaFormulario" required>
                    </div>

                    <div class="CampoFormulario">
                        <label class="EtiquetaFormulario">N° Colegiatura (COP)</label>
                        <input type="text" id="cop" placeholder="Ej. 12345" class="EntradaFormulario" required>
                    </div>

                    <div class="CampoFormulario">
                        <label class="EtiquetaFormulario">Especialidad</label>
                        <input type="text" id="especialidad" placeholder="Ej. Ortodoncia" class="EntradaFormulario" required>
                    </div>

                    <div class="CampoFormulario">
                        <label class="EtiquetaFormulario">Correo Electrónico (Usuario)</label>
                        <input type="email" id="correo" placeholder="correo@clinica.com" class="EntradaFormulario" required>
                    </div>

                    <div class="CampoFormulario">
                        <label class="EtiquetaFormulario">Contraseña Temporal</label>
                        <input type="password" id="password" placeholder="Asigne una contraseña" class="EntradaFormulario" required>
                    </div>

                    <div class="GrupoBotones">
                        <button type="submit" class="BotonAccion BotonRegistrar">Crear Cuenta Médica</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
    <script src="../js/admin-personal.js"></script>
</body>
</html>
